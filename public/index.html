<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baller Alert IG Post Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;800&family=Montserrat:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lime: #CCFF00;
    --black: #0a0a0a;
    --mid: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
  }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  header { text-align: center; margin-bottom: 40px; }
  header .brand { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 6px; color: var(--lime); margin-bottom: 8px; }
  header h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; text-transform: uppercase; color: #fff; }
  header p { color: var(--muted); font-size: 13px; margin-top: 8px; }

  .card { background: var(--mid); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 100%; max-width: 560px; margin-bottom: 24px; }
  .card > label, .section-title { display: block; font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--lime); margin-bottom: 12px; }

  .url-row { display: flex; gap: 10px; }

  input[type="text"], textarea {
    background: var(--black); border: 1px solid var(--border); border-radius: 8px;
    color: #fff; font-family: 'Montserrat', sans-serif; font-size: 13px;
    padding: 12px 16px; outline: none; transition: border-color 0.2s; width: 100%;
  }
  input[type="text"] { width: auto; flex: 1; }
  input[type="text"]:focus, textarea:focus { border-color: var(--lime); }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }
  textarea { resize: vertical; min-height: 80px; }

  button {
    background: var(--lime); border: none; border-radius: 8px; color: var(--black);
    cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 15px;
    font-weight: 700; letter-spacing: 1px; padding: 12px 20px; text-transform: uppercase;
    transition: opacity 0.2s, transform 0.1s; white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 8px 14px; }
  .btn-secondary:hover { border-color: var(--lime); color: var(--lime); }

  .fields { display: flex; flex-direction: column; gap: 16px; }
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group > label { font-size: 11px; letter-spacing: 2px; color: var(--muted); font-weight: 600; }

  .img-controls { display: flex; gap: 12px; align-items: flex-start; }
  .img-thumb-box { width: 72px; height: 72px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover; background: var(--black); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; flex-shrink: 0; overflow: hidden; }
  .img-thumb-box img { width: 100%; height: 100%; object-fit: cover; }

  .status { font-size: 12px; padding: 10px 14px; border-radius: 6px; margin-top: 10px; display: none; line-height: 1.6; }
  .status.info  { background: #1a2a00; color: var(--lime); border: 1px solid #2a4000; display: block; }
  .status.error { background: #2a0a0a; color: #ff6b6b; border: 1px solid #4a1a1a; display: block; }
  .status.warn  { background: #2a1e00; color: #ffcc44; border: 1px solid #4a3800; display: block; }

  /* IG PREVIEW */
  .preview-section { width: 100%; max-width: 560px; }
  .preview-label { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--lime); text-transform: uppercase; margin-bottom: 16px; text-align: center; }

  #ig-post {
    position: relative; width: 100%; max-width: 480px; aspect-ratio: 1 / 1;
    overflow: hidden; background: #111; border-radius: 8px; margin: 0 auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #post-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #post-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 52%, rgba(0,0,0,0.95) 68%, rgba(0,0,0,1) 100%); }
  #post-logo { position: absolute; top: 3%; left: 3%; width: 13%; max-width: 68px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8)); }
  #post-text { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 6% 5%; text-align: center; }
  #post-byline { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: clamp(8px, 2vw, 13px); letter-spacing: 0.25em; color: #fff; text-transform: uppercase; margin-bottom: 2%; opacity: 0.9; }
  #post-headline { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(18px, 5.5vw, 38px); line-height: 1.1; color: var(--lime); text-shadow: 0 2px 12px rgba(0,0,0,0.8); }

  .download-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .btn-download { background: var(--lime); color: var(--black); font-size: 13px; padding: 12px 28px; border-radius: 8px; }

  #export-canvas { display: none; }

  .spinner { width: 15px; height: 15px; border: 2px solid rgba(0,0,0,0.2); border-top-color: var(--black); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .upload-label {
    display: inline-block; cursor: pointer; padding: 8px 14px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text); background: transparent; transition: all 0.2s;
  }
  .upload-label:hover { border-color: var(--lime); color: var(--lime); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <div class="brand">Baller Alert</div>
  <h1>IG Post Generator</h1>
  <p>Paste a story URL → get a ready-to-post image</p>
</header>

<!-- STEP 1 -->
<div class="card">
  <label>Step 1 — Paste Story URL</label>
  <div class="url-row">
    <input type="text" id="url-input" placeholder="https://balleralert.com/profiles/blogs/..." />
    <button id="fetch-btn" onclick="fetchStory()">Fetch</button>
  </div>
  <div class="status" id="fetch-status"></div>
</div>

<!-- STEP 2 -->
<div class="card" id="edit-card" style="display:none">
  <div class="section-title">Step 2 — Review &amp; Edit</div>
  <div class="fields">

    <div class="field-group">
      <label>Headline</label>
      <textarea id="headline-input" oninput="updatePreview()" placeholder="Headline will appear here..."></textarea>
    </div>

    <div class="field-group">
      <label>Article Image</label>
      <div class="img-controls">
        <div class="img-thumb-box" id="img-thumb-box">🖼</div>
        <div>
          <div style="font-size:12px; color:var(--muted); margin-bottom:8px" id="img-status-text">Loading image...</div>
          <label class="upload-label">
            Replace Image
            <input type="file" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
          </label>
          <p class="hint">Image is pulled automatically.<br>Use this only if you want a different photo.</p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- STEP 3 -->
<div class="preview-section" id="preview-section" style="display:none">
  <div class="preview-label">Step 3 — Preview &amp; Download</div>

  <div id="ig-post">
    <img id="post-bg" src="" alt="" crossorigin="anonymous" />
    <div id="post-gradient"></div>
    <svg id="post-logo" viewBox="0 0 120 132" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="32" r="26" fill="none" stroke="white" stroke-width="5"/>
      <circle cx="60" cy="32" r="15" fill="none" stroke="white" stroke-width="4"/>
      <circle cx="60" cy="32" r="5" fill="white"/>
      <line x1="60" y1="58" x2="60" y2="76" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <line x1="60" y1="76" x2="40" y2="100" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <line x1="60" y1="76" x2="80" y2="100" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <line x1="46" y1="88" x2="74" y2="88" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <text x="60" y="117" font-family="Arial Black,sans-serif" font-size="13" font-weight="900" fill="white" text-anchor="middle">BALLER</text>
      <text x="60" y="131" font-family="Arial Black,sans-serif" font-size="13" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">ALERT</text>
    </svg>
    <div id="post-text">
      <div id="post-byline">-BALLER ALERT-</div>
      <div id="post-headline">Headline goes here</div>
    </div>
  </div>

  <div class="download-row">
    <button class="btn-download" onclick="downloadImage()">⬇ Download Post</button>
    <button class="btn-secondary" onclick="resetAll()">Start Over</button>
  </div>
</div>

<canvas id="export-canvas"></canvas>

<script>
async function fetchStory() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;

  const btn = document.getElementById('fetch-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Fetching...';
  setStatus('info', 'Fetching article...');

  try {
    const apiUrl = `/api/fetch-article?url=${encodeURIComponent(url)}`;
    const res = await fetch(apiUrl);
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Failed to fetch article');

    // Set headline
    document.getElementById('headline-input').value = data.headline;
    updatePreview();
    showEditAndPreview();

    // Set image
    if (data.imageBase64) {
      setImage(data.imageBase64);
      document.getElementById('img-status-text').textContent = 'Image loaded ✓';
      setStatus('info', '✓ Done! Edit headline if needed, then download.');
    } else {
      document.getElementById('img-status-text').textContent = 'Image not available — upload manually';
      setStatus('warn', '⚠ Headline loaded but image could not be fetched. Please upload the image.');
    }

  } catch (err) {
    console.error(err);
    showEditAndPreview();
    setStatus('error', '⚠ ' + (err.message || 'Could not fetch article. Try again or fill in manually.'));
    document.getElementById('img-status-text').textContent = 'Upload image manually';
  }

  btn.disabled = false;
  btn.textContent = 'Fetch';
}

function setImage(src) {
  const bg = document.getElementById('post-bg');
  bg.src = src;

  const box = document.getElementById('img-thumb-box');
  box.innerHTML = '';
  const img = document.createElement('img');
  img.src = src;
  box.appendChild(img);
}

function handleImageUpload(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    setImage(e.target.result);
    document.getElementById('img-status-text').textContent = input.files[0].name + ' ✓';
    showEditAndPreview();
  };
  reader.readAsDataURL(input.files[0]);
}

function updatePreview() {
  const h = document.getElementById('headline-input').value.trim();
  document.getElementById('post-headline').textContent = h || 'Headline goes here';
}

function showEditAndPreview() {
  document.getElementById('edit-card').style.display = 'block';
  document.getElementById('preview-section').style.display = 'block';
}

async function downloadImage() {
  const btn = event.target;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Generating...';

  try {
    const canvas = document.getElementById('export-canvas');
    const S = 1080;
    canvas.width = S; canvas.height = S;
    const ctx = canvas.getContext('2d');
    await document.fonts.ready;

    // BG
    const bg = document.getElementById('post-bg');
    if (bg.src && bg.complete && bg.naturalWidth > 0) {
      const r = bg.naturalWidth / bg.naturalHeight;
      let dw, dh, dx, dy;
      if (r > 1) { dh = S; dw = S * r; dx = (S - dw) / 2; dy = 0; }
      else        { dw = S; dh = S / r; dx = 0; dy = (S - dh) / 2; }
      ctx.drawImage(bg, dx, dy, dw, dh);
    } else {
      ctx.fillStyle = '#222'; ctx.fillRect(0, 0, S, S);
    }

    // Gradient
    const g = ctx.createLinearGradient(0, S * 0.30, 0, S);
    g.addColorStop(0,    'rgba(0,0,0,0)');
    g.addColorStop(0.22, 'rgba(0,0,0,0.55)');
    g.addColorStop(0.38, 'rgba(0,0,0,0.92)');
    g.addColorStop(1,    'rgba(0,0,0,1)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);

    // Text
    const headline = document.getElementById('headline-input').value.trim() || 'Headline';
    const padX = S * 0.06, maxW = S - padX * 2;

    function wrap(text, size) {
      ctx.font = `800 ${size}px 'Barlow Condensed', sans-serif`;
      const words = text.split(' ');
      const lines = []; let line = '';
      for (const w of words) {
        const t = line ? line + ' ' + w : w;
        if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
        else line = t;
      }
      if (line) lines.push(line);
      return lines;
    }

    let fs = 112, lines;
    while (fs > 44) { lines = wrap(headline, fs); if (lines.length <= 3) break; fs -= 6; }

    const lh = fs * 1.1, bh = 30, gap = 26, pad = S * 0.052;
    const blockH = bh + gap + lines.length * lh;
    let y = S - pad - blockH;

    ctx.font = `700 ${bh}px 'Montserrat', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.textAlign = 'center';
    ctx.fillText('-BALLER ALERT-', S / 2, y + bh);

    ctx.font = `800 ${fs}px 'Barlow Condensed', sans-serif`;
    ctx.fillStyle = '#CCFF00';
    ctx.textAlign = 'center';
    let hy = y + bh + gap;
    for (const ln of lines) { ctx.fillText(ln, S / 2, hy + fs * 0.85); hy += lh; }

    // Logo
    const L = S * 0.13;
    const lx = S * 0.03 + L / 2, ly = S * 0.03 + L / 2;
    ctx.save();
    ctx.strokeStyle = 'white'; ctx.fillStyle = 'white'; ctx.lineCap = 'round';
    ctx.lineWidth = L*0.09; ctx.beginPath(); ctx.arc(lx, ly, L/2, 0, Math.PI*2); ctx.stroke();
    ctx.lineWidth = L*0.07; ctx.beginPath(); ctx.arc(lx, ly, L*0.30, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(lx, ly, L*0.08, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = L*0.09;
    ctx.beginPath(); ctx.moveTo(lx, ly+L*0.22); ctx.lineTo(lx, ly+L*0.44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx, ly+L*0.44); ctx.lineTo(lx-L*0.22, ly+L*0.60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx, ly+L*0.44); ctx.lineTo(lx+L*0.22, ly+L*0.60); ctx.stroke();
    ctx.lineWidth = L*0.07;
    ctx.beginPath(); ctx.moveTo(lx-L*0.14, ly+L*0.52); ctx.lineTo(lx+L*0.14, ly+L*0.52); ctx.stroke();
    ctx.font = `900 ${L*0.17}px Arial Black, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('BALLER', lx, ly+L*0.77); ctx.fillText('ALERT', lx, ly+L*0.94);
    ctx.restore();

    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const slug = (document.getElementById('headline-input').value || 'post')
        .substring(0, 30).replace(/\s+/g, '-').replace(/[^a-z0-9-]/gi, '').toLowerCase();
      a.download = `baller-alert-${slug}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');

  } catch (err) {
    alert('Download failed: ' + err.message);
  }

  btn.disabled = false;
  btn.textContent = '⬇ Download Post';
}

function setStatus(type, msg) {
  const el = document.getElementById('fetch-status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

function resetAll() {
  document.getElementById('url-input').value = '';
  document.getElementById('fetch-status').className = 'status';
  document.getElementById('edit-card').style.display = 'none';
  document.getElementById('preview-section').style.display = 'none';
  document.getElementById('headline-input').value = '';
  document.getElementById('post-bg').src = '';
  document.getElementById('post-headline').textContent = 'Headline goes here';
  document.getElementById('img-thumb-box').innerHTML = '🖼';
  document.getElementById('img-status-text').textContent = 'Loading image...';
}

document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchStory();
});
</script>
</body>
</html>
