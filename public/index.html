<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baller Alert IG Post Generator</title>
<link rel="stylesheet" href="https://use.typekit.net/nkd0qxj.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lime: #E6FC00;
    --black: #0a0a0a;
    --mid: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
  }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'bebas-neue-pro', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  header { text-align: center; margin-bottom: 40px; }
  header .brand { font-family: 'bebas-neue-pro', sans-serif; font-size: 13px; letter-spacing: 6px; color: var(--lime); margin-bottom: 8px; }
  header h1 { font-family: 'bebas-neue-pro', sans-serif; font-size: 42px; font-weight: 400; text-transform: uppercase; color: #fff; letter-spacing: 3px; }
  header p { color: var(--muted); font-size: 13px; margin-top: 8px; font-family: sans-serif; }

  .card { background: var(--mid); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 100%; max-width: 560px; margin-bottom: 24px; }
  .card > label, .section-title { display: block; font-size: 14px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; color: var(--lime); margin-bottom: 12px; font-family: 'bebas-neue-pro', sans-serif; }

  .url-row { display: flex; gap: 10px; }

  input[type="text"], textarea {
    background: var(--black); border: 1px solid var(--border); border-radius: 8px;
    color: #fff; font-family: sans-serif; font-size: 13px;
    padding: 12px 16px; outline: none; transition: border-color 0.2s; width: 100%;
  }
  input[type="text"] { width: auto; flex: 1; }
  input[type="text"]:focus, textarea:focus { border-color: var(--lime); }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }
  textarea { resize: vertical; min-height: 80px; }

  button {
    background: var(--lime); border: none; border-radius: 8px; color: var(--black);
    cursor: pointer; font-family: 'bebas-neue-pro', sans-serif; font-size: 18px;
    font-weight: 400; letter-spacing: 2px; padding: 12px 20px; text-transform: uppercase;
    transition: opacity 0.2s, transform 0.1s; white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); font-size: 14px; padding: 8px 14px; font-family: 'bebas-neue-pro', sans-serif; }
  .btn-secondary:hover { border-color: var(--lime); color: var(--lime); }

  .fields { display: flex; flex-direction: column; gap: 16px; }
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group > label { font-size: 11px; letter-spacing: 2px; color: var(--muted); font-weight: 600; font-family: sans-serif; }

  .img-controls { display: flex; gap: 12px; align-items: flex-start; }
  .img-thumb-box { width: 72px; height: 72px; border-radius: 8px; border: 1px solid var(--border); background: var(--black); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; flex-shrink: 0; overflow: hidden; }
  .img-thumb-box img { width: 100%; height: 100%; object-fit: cover; }

  .status { font-size: 12px; padding: 10px 14px; border-radius: 6px; margin-top: 10px; display: none; line-height: 1.6; font-family: sans-serif; }
  .status.info  { background: #1a2a00; color: var(--lime); border: 1px solid #2a4000; display: block; }
  .status.error { background: #2a0a0a; color: #ff6b6b; border: 1px solid #4a1a1a; display: block; }
  .status.warn  { background: #2a1e00; color: #ffcc44; border: 1px solid #4a3800; display: block; }

  .preview-section { width: 100%; max-width: 560px; }
  .preview-label { font-size: 14px; font-weight: 400; letter-spacing: 4px; color: var(--lime); text-transform: uppercase; margin-bottom: 16px; text-align: center; font-family: 'bebas-neue-pro', sans-serif; }

  #ig-post {
    position: relative; width: 100%; max-width: 480px; aspect-ratio: 4 / 5;
    overflow: hidden; background: #111; border-radius: 8px; margin: 0 auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #preview-canvas { display: block; width: 100%; height: 100%; }

  .download-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .btn-download { background: var(--lime); color: var(--black); font-size: 16px; padding: 12px 28px; border-radius: 8px; font-family: 'bebas-neue-pro', sans-serif; letter-spacing: 2px; }

  #export-canvas { display: none; }

  .spinner { width: 15px; height: 15px; border: 2px solid rgba(0,0,0,0.2); border-top-color: var(--black); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .upload-label {
    display: inline-block; cursor: pointer; padding: 8px 14px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: 'bebas-neue-pro', sans-serif;
    font-weight: 400; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text); background: transparent; transition: all 0.2s;
  }
  .upload-label:hover { border-color: var(--lime); color: var(--lime); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; font-family: sans-serif; }
</style>
</head>
<body>

<header>
  <div class="brand">Baller Alert</div>
  <h1>IG Post Generator</h1>
  <p>Paste a story URL → get a ready-to-post image</p>
</header>

<div class="card">
  <label>Step 1 — Paste Story URL</label>
  <div class="url-row">
    <input type="text" id="url-input" placeholder="https://balleralert.com/profiles/blogs/..." />
    <button id="fetch-btn" onclick="fetchStory()">Fetch</button>
    <button class="btn-secondary" onclick="doManually()" style="white-space:nowrap">Do Manually</button>
  </div>
  <div class="status" id="fetch-status"></div>
</div>

<div class="card" id="edit-card" style="display:none">
  <div class="section-title">Step 2 — Review & Edit</div>
  <div class="fields">
    <div class="field-group">
      <label>Headline</label>
      <textarea id="headline-input" oninput="updatePreview()" placeholder="Headline will appear here..."></textarea>
    </div>
    <div class="field-group">
      <label>Article Image</label>
      <div class="img-controls">
        <div class="img-thumb-box" id="img-thumb-box">🖼</div>
        <div>
          <div style="font-size:12px; color:var(--muted); margin-bottom:8px; font-family:sans-serif" id="img-status-text">Loading image...</div>
          <label class="upload-label">
            Replace Image
            <input type="file" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
          </label>
          <p class="hint">Image is pulled automatically.<br>Use this only if you want a different photo.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="preview-section" id="preview-section" style="display:none">
  <div class="preview-label">Step 3 — Preview & Download</div>
  <div id="ig-post">
    <canvas id="preview-canvas" width="1080" height="1350"></canvas>
  </div>
  <div class="download-row">
    <button class="btn-download" onclick="downloadImage(event)">⬇ Download Post</button>
    <button class="btn-secondary" onclick="resetAll()">Start Over</button>
  </div>
</div>

<canvas id="export-canvas"></canvas>

<script>
// ===== LOCKED LAYOUT (1080 x 1350). Every post uses these exact positions. =====
const W = 1080, H = 1350;
const TEXT_TOP   = 925;   // top of the "-BALLER ALERT-" tag, same spot on every post
const BYLINE_SIZE = 30;
const BYLINE_GAP  = 14;   // space between tag and headline
const HEAD_SIZE   = 104;  // standard headline size

const MAX_LINES   = 3;
const PAD_X       = W * 0.06;

const bgImg = new Image();
const logoImg = new Image();
logoImg.src = 'BA_logo_BW_transparent.png';
logoImg.onload = () => renderPost();

async function renderPost(target) {
  const canvas = target || document.getElementById('preview-canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  try { await document.fonts.load('400 ' + HEAD_SIZE + 'px "bebas-neue-pro"'); } catch (e) {}

  // Background, cover crop
  if (bgImg.src && bgImg.complete && bgImg.naturalWidth > 0) {
    const r = bgImg.naturalWidth / bgImg.naturalHeight, cr = W / H;
    let dw, dh;
    if (r > cr) { dh = H; dw = H * r; } else { dw = W; dh = W / r; }
    ctx.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } else {
    ctx.fillStyle = '#222'; ctx.fillRect(0, 0, W, H);
  }

  // Gradient, darkens behind the fixed text area
  const g = ctx.createLinearGradient(0, H * 0.52, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.30, 'rgba(0,0,0,0.80)');
  g.addColorStop(0.50, 'rgba(0,0,0,1)');
  g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const headline = (document.getElementById('headline-input').value || '').trim() || 'Headline goes here';
  const maxW = W - PAD_X * 2;
  function wrap(text, size) {
    ctx.font = '400 ' + size + 'px "bebas-neue-pro", sans-serif';
    const words = text.split(/\s+/);
    const lines = []; let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
      else line = t;
    }
    if (line) lines.push(line);
    return lines;
  }

  // Same size every time; only shrinks a little if a title won't fit in 3 lines
  let fs = HEAD_SIZE, lines = wrap(headline, fs);
  while (lines.length > MAX_LINES && fs > 50) { fs -= 4; lines = wrap(headline, fs); }

  // Tag, fixed position
  ctx.textAlign = 'center';
  ctx.font = '400 ' + BYLINE_SIZE + 'px "bebas-neue-pro", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('-BALLER ALERT-', W / 2, TEXT_TOP + BYLINE_SIZE);

  // Headline, always starts right under the tag and flows down
  ctx.font = '400 ' + fs + 'px "bebas-neue-pro", sans-serif';
  ctx.fillStyle = '#E6FC00';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 2;
  const lh = fs * 1.04;
  let y = TEXT_TOP + BYLINE_SIZE + BYLINE_GAP;
  for (const ln of lines) { ctx.fillText(ln, W / 2, y + fs * 0.85); y += lh; }
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // Logo
  if (logoImg.complete && logoImg.naturalWidth > 0) {
    const L = W * 0.13;
    ctx.drawImage(logoImg, W * 0.03, W * 0.03, L, L);
  }
  return canvas;
}

async function fetchStory() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;
  const btn = document.getElementById('fetch-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Fetching...';
  setStatus('info', 'Fetching article...');
  try {
    const res = await fetch('/api/fetch-article?url=' + encodeURIComponent(url));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to fetch article');
    document.getElementById('headline-input').value = data.headline;
    showEditAndPreview();
    updatePreview();
    if (data.imageBase64) {
      setImage(data.imageBase64);
      document.getElementById('img-status-text').textContent = 'Image loaded ✓';
      setStatus('info', '✓ Done! Edit headline if needed, then download.');
    } else {
      document.getElementById('img-status-text').textContent = 'Image not available, upload manually';
      setStatus('warn', '⚠ Headline loaded but image could not be fetched. Please upload the image.');
    }
  } catch (err) {
    console.error(err);
    showEditAndPreview();
    setStatus('error', '⚠ ' + (err.message || 'Could not fetch article. Try again or fill in manually.'));
    document.getElementById('img-status-text').textContent = 'Upload image manually';
  }
  btn.disabled = false;
  btn.textContent = 'Fetch';
}

function doManually() {
  document.getElementById('headline-input').value = '';
  bgImg.removeAttribute('src');
  document.getElementById('img-thumb-box').innerHTML = '🖼';
  document.getElementById('img-status-text').textContent = 'Upload your image below';
  document.getElementById('fetch-status').className = 'status';
  showEditAndPreview();
  updatePreview();
}

function setImage(src) {
  bgImg.onload = () => renderPost();
  bgImg.src = src;
  const box = document.getElementById('img-thumb-box');
  box.innerHTML = '';
  const img = document.createElement('img');
  img.src = src;
  box.appendChild(img);
}

function handleImageUpload(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    setImage(e.target.result);
    document.getElementById('img-status-text').textContent = input.files[0].name + ' ✓';
    showEditAndPreview();
  };
  reader.readAsDataURL(input.files[0]);
}

function updatePreview() { renderPost(); }

function showEditAndPreview() {
  document.getElementById('edit-card').style.display = 'block';
  document.getElementById('preview-section').style.display = 'block';
}

async function downloadImage(e) {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Generating...';
  try {
    const canvas = await renderPost(document.getElementById('export-canvas'));
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const slug = (document.getElementById('headline-input').value || 'post')
        .substring(0, 30).replace(/\s+/g, '-').replace(/[^a-z0-9-]/gi, '').toLowerCase();
      a.download = 'baller-alert-' + slug + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  } catch (err) {
    alert('Download failed: ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = '⬇ Download Post';
}

function setStatus(type, msg) {
  const el = document.getElementById('fetch-status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

function resetAll() {
  document.getElementById('url-input').value = '';
  document.getElementById('fetch-status').className = 'status';
  document.getElementById('edit-card').style.display = 'none';
  document.getElementById('preview-section').style.display = 'none';
  document.getElementById('headline-input').value = '';
  bgImg.removeAttribute('src');
  document.getElementById('img-thumb-box').innerHTML = '🖼';
  document.getElementById('img-status-text').textContent = 'Loading image...';
}

document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchStory();
});
</script>
</body>
</html>
